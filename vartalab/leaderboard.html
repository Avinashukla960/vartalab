<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard — VARTALAB</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236d5cff'/><text x='50' y='72' font-size='62' font-weight='bold' font-family='Arial' fill='white' text-anchor='middle'>V</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { base:'#0b0f1a', card:'#151b2b', accent:'#6d5cff', cyan2:'#22d3ee' } } } };
</script>
<link rel="stylesheet" href="css/style.css">
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</head>
<body>
<main>
  <section class="section" style="padding-top:44px">
    <div class="wrap" style="max-width:860px">
      <div class="center mb-4">
        <span class="eyebrow">Rankings</span>
        <h2>🏆 Leaderboard</h2>
        <p class="muted" style="margin:6px 0 0">Compete weekly, climb the rating, and claim your crown.</p>
      </div>

      <div class="tab-row center mb-4" style="justify-content:center" id="lb-tabs">
        <button class="tab active" data-tab="Global">Global</button>
        <button class="tab" data-tab="Weekly">Weekly</button>
        <button class="tab" data-tab="Monthly">Monthly</button>
      </div>

      <!-- Podium (top 3) -->
      <div class="podium mb-4" id="lb-podium"></div>

      <!-- Full list -->
      <div class="card" style="padding:10px">
        <div class="leader-row text-xs dim uppercase" style="padding-bottom:6px">
          <span>Rank</span><span></span><span>Student</span><span style="text-align:right">Rating</span><span style="text-align:right">Points</span>
        </div>
        <div id="lb-list"></div>
      </div>

      <!-- You card -->
      <div class="card card-cta mt-3" id="lb-you"></div>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";
  const u = DB.currentUser;
  let tab = "Global";

  function sortedList() {
    const base = DB.leaderboard.slice().sort(function (a, b) { return b.rating - a.rating; });
    if (tab === "Global") return base;
    // Weekly/Monthly: pretend a reshuffle but keep the same faces (demo)
    const copy = base.slice();
    if (tab === "Weekly") {
      copy.sort(function () { return Math.random() - 0.5; }).slice(0, 3);
      // gentle deterministic jitter: swap a couple of adjacent pairs
      for (let i = 0; i < copy.length - 1; i += 2) {
        const a = copy[i], b = copy[i + 1];
        if (b && Math.random() < 0.5) { copy[i] = b; copy[i + 1] = a; }
      }
    }
    return copy;
  }

  function render() {
    const list = sortedList();
    const me = list.findIndex(function (x) { return x.isMe || x.name === u.name; });

    /* podium */
    const top3 = list.slice(0, 3);
    const order = [1, 0, 2]; // 2nd, 1st, 3rd visually
    const classes = ["second", "first", "third"];
    document.getElementById("lb-podium").innerHTML = order.map(function (i, k) {
      const p = top3[i];
      if (!p) return "";
      const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : "🥉";
      return (
        '<div class="p-card ' + classes[k] + '">' +
          '<div style="font-size:1.7rem">' + medal + "</div>" +
          '<span class="avatar mt-2">' + p.avatar + "</span>" +
          '<b class="d-block mt-1">' + window.esc(p.name) + "</b>" +
          '<span class="badge badge-cyan mt-1">' + p.rating + " rating</span>" +
        "</div>"
      );
    }).join("");

    /* list */
    document.getElementById("lb-list").innerHTML = window.renderLeaderboard(list, true);

    /* you card */
    const meRow = list[me];
    if (meRow) {
      const rank = me + 1;
      document.getElementById("lb-you").innerHTML =
        '<div class="flex" style="gap:14px;flex-wrap:wrap">' +
          '<span class="avatar avatar-lg">' + u.avatar + "</span>" +
          '<div class="grow">' +
            '<span class="badge badge-accent">YOU</span>' +
            "<h3 class='mt-1' style='margin-bottom:0'>" + window.esc(u.name) + "</h3>" +
            '<span class="text-sm muted">' + u.goal + " · Level " + u.selfLevel + "</span>" +
          "</div>" +
          '<div class="grid g3" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;flex:1;min-width:260px">' +
            '<div class="card card-flat center" style="padding:12px"><b style="color:var(--cyan)">#' + rank + "</b><span class='text-xs dim'>Current rank</span></div>" +
            '<div class="card card-flat center" style="padding:12px"><b style="color:var(--teal)">' + meRow.rating + "</b><span class='text-xs dim'>Rating</span></div>" +
            '<div class="card card-flat center" style="padding:12px"><b style="color:var(--amber)">' + u.streak + "🔥</b><span class='text-xs dim'>Streak</span></div>" +
          "</div>" +
        "</div>";
    }

    window.VT.toast(tab + " board refreshed", "info");
  }

  document.querySelectorAll("#lb-tabs .tab").forEach(function (t) {
    t.addEventListener("click", function () {
      document.querySelectorAll("#lb-tabs .tab").forEach(function (x) { x.classList.remove("active"); });
      t.classList.add("active");
      tab = t.getAttribute("data-tab");
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
