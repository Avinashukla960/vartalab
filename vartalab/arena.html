<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Arena — VARTALAB</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236d5cff'/><text x='50' y='72' font-size='62' font-weight='bold' font-family='Arial' fill='white' text-anchor='middle'>V</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { base:'#0b0f1a', card:'#151b2b', accent:'#6d5cff', cyan2:'#22d3ee' } } } };
</script>
<link rel="stylesheet" href="css/style.css">
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</head>
<body>
<main>
  <section class="section" style="padding-top:44px">
    <div class="wrap" style="max-width:920px">
      <div class="flex-between mb-4">
        <div>
          <span class="eyebrow">Compete weekly</span>
          <h2>⚔️ IELTS Arena</h2>
          <p class="muted" style="margin:6px 0 0">Race the clock in live-style contests and climb the global rating.</p>
        </div>
        <span class="badge badge-amber">Practice contest · not an official IELTS exam</span>
      </div>
      <div id="arena-root"></div>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";
  const root = document.getElementById("arena-root");
  const u = DB.currentUser;
  const c = DB.contests[0];

  /* ---------- Contest questions (pooled from lessons + assessments) ---------- */
  const pool = [];
  DB.lessons.forEach(function (l) { l.questions.forEach(function (q) { pool.push(q); }); });
  DB.assessments.forEach(function (a) { a.qs.forEach(function (q) { pool.push({ q: q.q, options: q.options, correct: q.correct, explain: "Contest question — answer shown at the end." }); }); });

  function draw(n) {
    const arr = pool.slice();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr.slice(0, n);
  }

  let contestQs = [];
  let answers = [];
  let qIndex = 0;
  let timerId = null;
  let startedAt = null;
  const CONTEST_SECONDS = 15 * 60; // 15 min

  /* ---------- Landing: contest card + countdown + past contests ---------- */
  function renderLanding() {
    const target = window.nextContestDate();
    const lastAttempt = u.contestAttempt;
    root.innerHTML =
      '<div class="card card-cta card-pad-lg">' +
        '<div class="flex-between" style="flex-wrap:wrap;gap:12px">' +
          '<div><span class="badge badge-amber"><span class="live-dot"></span> NEXT CONTEST</span>' +
          "<h2 class='mt-2' style='font-size:clamp(1.3rem,3vw,1.8rem)'>" + window.esc(c.title) + "</h2>" +
          '<p class="muted text-sm" style="margin:4px 0 0">' + c.totalQuestions + " questions · " + c.duration + " · starts " + c.startTime + " · " + c.entries.toLocaleString("en-IN") + " entries</p></div>" +
          '<span class="badge badge-accent" style="font-size:.9rem">⚡ +' + c.ratingReward + " rating for top half</span>" +
        "</div>" +
        '<div class="mt-3" id="arena-cd"></div>' +
        '<div class="flex mt-3" style="gap:12px;flex-wrap:wrap">' +
          '<button class="btn btn-primary btn-lg" id="arena-enter">' + (lastAttempt ? "Practice again" : "Participate now") + " →</button>" +
          '<a class="btn btn-ghost btn-lg" href="leaderboard.html">View leaderboard</a>' +
        "</div>" +
      "</div>" +
      '<div class="card mt-3 text-sm muted" style="border-left:3px solid var(--amber)">' +
        "⚠️ <b>Disclaimer:</b> This is a <b>practice contest</b> for learning, not an official IELTS examination. Scores and ratings here do not affect any real IELTS result." +
      "</div>" +
      '<div class="mt-4">' +
        '<div class="flex-between mb-2"><h3>📜 Your contest history</h3></div>' +
        '<div id="arena-past"></div>' +
      "</div>";

    const cd = document.getElementById("arena-cd");
    cd.innerHTML = window.countdownHTML(target.getTime() - Date.now());
    window.tickCountdown(cd, target);

    document.getElementById("arena-enter").addEventListener("click", function () {
      contestQs = draw(Math.min(3, c.totalQuestions));
      answers = [];
      qIndex = 0;
      startedAt = Date.now();
      timerId = null;
      renderContestIntro();
    });

    const past = DB.pastContests;
    document.getElementById("arena-past").innerHTML = past.map(function (p) {
      const pct = Math.round((p.score / p.total) * 100);
      return (
        '<div class="list-row">' +
          '<span class="icon-badge" style="background:rgba(109,92,255,.1)">' + window.VT.icon("trophy", 18) + "</span>" +
          '<div class="l-body"><b class="text-sm">' + window.esc(p.title) + "</b>" +
          '<div class="text-xs dim">' + p.date + " · " + p.score + "/" + p.total + " · rank #" + p.rank + " of " + p.entries + "</div></div>" +
          '<div class="center"><b style="color:var(--teal)">+' + p.ratingGain + "</b><div class='text-xs dim'>rating</div></div>" +
          '<span class="badge badge-cyan">' + pct + "%</span>" +
        "</div>"
      );
    }).join("") || '<p class="muted">No contests yet — enter the next one!</p>';
  }

  /* ---------- Contest intro ---------- */
  function renderContestIntro() {
    root.innerHTML =
      '<div class="card card-pad-lg center">' +
        '<div style="font-size:2.8rem">⚔️</div>' +
        "<h2>" + window.esc(c.title) + " — Mini contest</h2>" +
        '<p class="muted">' + contestQs.length + " questions · " + c.duration + " total · live rating on the line. No instant feedback — submit at the end.</p>" +
        '<div class="grid g3 mt-3" style="max-width:480px;margin:0 auto;text-align:left">' +
          '<div class="card card-flat center"><b style="font-size:1.2rem">' + contestQs.length + "</b><span class='text-xs dim'>Questions</span></div>" +
          '<div class="card card-flat center"><b style="font-size:1.2rem">' + c.duration + "</b><span class='text-xs dim'>Window</span></div>" +
          '<div class="card card-flat center"><b style="font-size:1.2rem">+' + c.ratingReward + "</b><span class='text-xs dim'>Rating reward</span></div>" +
        "</div>" +
        '<div class="flex mt-4" style="justify-content:center;gap:12px">' +
          '<button class="btn btn-primary btn-lg" id="arena-go">Start contest →</button>' +
          '<button class="btn btn-ghost btn-lg" id="arena-back">Cancel</button>' +
        "</div>" +
      "</div>";
    document.getElementById("arena-go").addEventListener("click", function () {
      if (!timerId) timerId = window.startClock("arena-clock", CONTEST_SECONDS, submitContest);
      renderContestQuestion();
    });
    document.getElementById("arena-back").addEventListener("click", renderLanding);
  }

  /* ---------- Contest question (one at a time, Q1/3) ---------- */
  function renderContestQuestion() {
    const q = contestQs[qIndex];
    const chosen = answers[qIndex];
    root.innerHTML =
      '<div class="card card-pad-lg">' +
        '<div class="flex-between mb-2">' +
          '<span class="eyebrow">Q' + (qIndex + 1) + "/" + contestQs.length + "</span>" +
          '<span class="badge badge-red" style="font-size:.9rem">⏱ <b id="arena-clock">--:--</b></span>' +
        "</div>" +
        '<div class="progress mb-3"><div class="progress-fill" style="width:' + ((qIndex + 1) / contestQs.length) * 100 + '%"></div></div>' +
        '<div class="flex" style="gap:6px;margin-bottom:14px">' + contestQs.map(function (_, i) {
          const cls = answers[i] !== undefined ? "done" : i === qIndex ? "cur" : "";
          return '<button class="q-nav ' + cls + '" data-j="' + i + '">' + (i + 1) + "</button>";
        }).join("") + "</div>" +
        '<h3 style="font-size:1.2rem;min-height:2.2em">' + window.esc(q.q) + "</h3>" +
        '<div class="mt-3">' +
          q.options.map(function (o, i) {
            return '<button class="quiz-option" data-i="' + i + '"' + (chosen === i ? ' style="border-color:var(--accent);background:var(--accent-dim)"' : "") + '>' +
              '<span class="opt-letter">' + String.fromCharCode(65 + i) + "</span>" + window.esc(o) +
              (chosen === i ? '<span class="option-check">✓</span>' : "") + "</button>";
          }).join("") +
        "</div>" +
        '<div class="flex-between mt-4" style="border-top:1px solid var(--border);padding-top:16px">' +
          '<button class="btn btn-ghost" id="arena-prev"' + (qIndex === 0 ? " disabled" : "") + ">← Prev</button>" +
          (qIndex === contestQs.length - 1
            ? '<button class="btn btn-green" id="arena-submit">Submit answers ✓</button>'
            : '<button class="btn btn-primary" id="arena-next">Next →</button>') +
        "</div>" +
      "</div>";

    root.querySelectorAll(".quiz-option").forEach(function (b) {
      b.addEventListener("click", function () {
        answers[qIndex] = Number(b.getAttribute("data-i"));
        renderContestQuestion();
      });
    });
    const prev = root.querySelector("#arena-prev");
    if (prev) prev.addEventListener("click", function () { qIndex--; renderContestQuestion(); });
    const next = root.querySelector("#arena-next");
    if (next) next.addEventListener("click", function () { qIndex++; renderContestQuestion(); });
    const submit = root.querySelector("#arena-submit");
    if (submit) submit.addEventListener("click", submitContest);
    root.querySelectorAll(".q-nav").forEach(function (b) {
      b.addEventListener("click", function () { qIndex = Number(b.getAttribute("data-j")); renderContestQuestion(); });
    });
  }

  /* ---------- Contest result ---------- */
  function submitContest() {
    if (timerId) { clearInterval(timerId); timerId = null; }
    let correct = 0;
    const wrongSkills = {};
    contestQs.forEach(function (q, i) {
      if (answers[i] === q.correct) correct++;
      else wrongSkills[q.skill] = 1;
    });
    const total = contestQs.length;
    const pct = Math.round((correct / total) * 100);

    // rating logic
    const topHalf = pct >= 50;
    const ratingGain = topHalf ? c.ratingReward : Math.max(-8, Math.round((pct - 50) / 10));
    const old = u.rating;
    u.rating = Math.min(2000, Math.max(1400, u.rating + ratingGain));
    u.highestRating = Math.max(u.highestRating, u.rating);
    u.streak += 1;
    const rank = Math.max(1, Math.round((100 - pct) / 3) + 15); // pretend ranking
    const percentile = Math.max(5, 100 - rank);
    u.contestAttempt = {
      date: new Date().toISOString(), title: c.title, score: correct, total: total,
      pct: pct, ratingGain: ratingGain, rank: rank, percentile: percentile,
    };
    const weakKeys = Object.keys(wrongSkills);
    if (weakKeys.length) u.weakAreas = Array.from(new Set((u.weakAreas || []).concat(weakKeys)));
    window.VT.saveState();

    root.innerHTML =
      '<div class="card card-pad-lg center">' +
        '<div style="font-size:3.2rem">' + (topHalf ? "🏆" : "💪") + "</div>" +
        '<span class="eyebrow">Contest finished</span>' +
        '<h2 class="mt-1">' + (topHalf ? "Top-half finish!" : "Good effort — keep training") + "</h2>" +
        '<div class="mt-2" id="arena-ring"></div>' +
        '<p class="muted mt-2">Score <b class="text-accent">' + correct + "/" + total + "</b> (" + pct + "%) · Estimated rank <b class='text-accent'>#" + rank + "</b> · Top " + percentile + "%</p>" +
        '<div class="grid g3 mt-2" style="max-width:560px;margin:0 auto;text-align:left">' +
          '<div class="card card-flat center"><b style="color:var(--cyan)">' + (ratingGain >= 0 ? "+" : "") + ratingGain + "</b><span class='text-xs dim'>Rating (" + old + " → " + u.rating + ")</span></div>" +
          '<div class="card card-flat center"><b style="color:var(--amber)">' + percentile + "%</b><span class='text-xs dim'>Percentile</span></div>" +
          '<div class="card card-flat center"><b style="color:var(--teal)">' + (Object.keys(wrongSkills).length ? Object.keys(wrongSkills).join(", ") : "Clean sweep") + "</b><span class='text-xs dim'>To improve</span></div>" +
        "</div>" +
        '<div class="flex mt-4" style="justify-content:center;gap:12px;flex-wrap:wrap">' +
          '<a class="btn btn-primary btn-lg" href="leaderboard.html">See where you rank →</a>' +
          '<button class="btn btn-ghost btn-lg" id="arena-again">↻ Practise again</button>' +
          '<a class="btn btn-ghost btn-lg" href="learn.html">Improve weak areas</a>' +
        "</div>" +
      "</div>";

    document.getElementById("arena-ring").innerHTML = window.progressRing(pct, 150, pct + "%", "Score");
    window.animateRings();
    document.getElementById("arena-again").addEventListener("click", function () {
      contestQs = draw(Math.min(3, c.totalQuestions));
      answers = []; qIndex = 0; timerId = null; renderContestIntro();
    });
    window.VT.toast("Rating " + (ratingGain >= 0 ? "+" : "") + ratingGain + " → " + u.rating, ratingGain >= 0 ? "success" : "info", "Contest complete");
    if (topHalf) window.VT.confetti();
  }

  renderLanding();
})();
</script>
<style>
  .q-nav {
    width: 30px; height: 30px; border-radius: 8px; font-size: .78rem; font-weight: 600;
    border: 1px solid var(--border-strong); background: rgba(255,255,255,.04); color: #a1a1aa;
  }
  .q-nav.cur { background: #fafafa; border-color: #fafafa; color: #09090b; }
  .q-nav.done { background: rgba(74,222,128,.12); border-color: rgba(74,222,128,.4); color: #4ade80; }
  .q-nav:hover { border-color: rgba(255,255,255,.4); }
</style>
</body>
</html>
