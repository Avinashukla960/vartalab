<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos — VARTALAB</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236d5cff'/><text x='50' y='72' font-size='62' font-weight='bold' font-family='Arial' fill='white' text-anchor='middle'>V</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { base:'#0b0f1a', card:'#151b2b', accent:'#6d5cff', cyan2:'#22d3ee' } } } };
</script>
<link rel="stylesheet" href="css/style.css">
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</head>
<body>
<main>
  <section class="section" style="padding-top:44px">
    <div class="wrap">
      <div class="flex-between mb-4">
        <div>
          <span class="eyebrow">Watch & learn</span>
          <h2>🎬 Video lessons</h2>
          <p class="muted" style="margin:6px 0 0">Curated YouTube lessons by skill. Watch, then take a quiz to lock it in.</p>
        </div>
      </div>
      <div class="tab-row mb-3" id="v-filters">
        <button class="tab active" data-f="All">All</button>
        <button class="tab" data-f="Tense">Tense</button>
        <button class="tab" data-f="Articles">Articles</button>
        <button class="tab" data-f="Prepositions">Prepositions</button>
        <button class="tab" data-f="Vocabulary">Vocabulary</button>
        <button class="tab" data-f="Speaking">Speaking</button>
      </div>
      <div class="grid gauto-lg" id="v-grid"></div>
      <div class="empty-state hidden mt-3" id="v-empty">
        <div class="e-icon">🎬</div>
        <b>No videos in this filter yet</b>
        <p class="text-sm">We add new curated lessons every week. Try another skill!</p>
      </div>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";
  const grid = document.getElementById("v-grid");
  const empty = document.getElementById("v-empty");
  let filter = "All";

  function render() {
    const list = DB.videos.filter(function (v) { return filter === "All" || v.skill === filter; });
    grid.innerHTML = list.map(window.videoCard).join("") ||
      '<div class="empty-state" style="grid-column:1/-1"><div class="e-icon">🎬</div><b>No videos here yet</b></div>';
    empty.classList.toggle("hidden", list.length > 0);
  }

  document.querySelectorAll("#v-filters .tab").forEach(function (t) {
    t.addEventListener("click", function () {
      document.querySelectorAll("#v-filters .tab").forEach(function (x) { x.classList.remove("active"); });
      t.classList.add("active");
      filter = t.getAttribute("data-f");
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
