<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papers — VARTALAB</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236d5cff'/><text x='50' y='72' font-size='62' font-weight='bold' font-family='Arial' fill='white' text-anchor='middle'>V</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { base:'#0b0f1a', card:'#151b2b', accent:'#6d5cff', cyan2:'#22d3ee' } } } };
</script>
<link rel="stylesheet" href="css/style.css">
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</head>
<body>
<main>
  <section class="section" style="padding-top:44px">
    <div class="wrap">
      <div class="flex-between mb-4">
        <div>
          <span class="eyebrow">Question bank</span>
          <h2>📄 Question papers</h2>
          <p class="muted" style="margin:6px 0 0">Exam-style papers for IELTS, boards, interviews and everyday English.</p>
        </div>
      </div>
      <div class="tab-row mb-3" id="p-filters">
        <button class="tab active" data-f="ALL">ALL</button>
        <button class="tab" data-f="IELTS">IELTS</button>
        <button class="tab" data-f="Interview">Interview</button>
        <button class="tab" data-f="Board">Board</button>
        <button class="tab" data-f="General">General</button>
      </div>
      <div class="grid gauto-lg" id="p-grid"></div>
      <div class="empty-state hidden mt-3" id="p-empty">
        <div class="e-icon">📄</div>
        <b>No papers for this filter yet</b>
        <p class="text-sm">Papers are added every week after live sessions.</p>
      </div>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";
  const grid = document.getElementById("p-grid");
  const empty = document.getElementById("p-empty");
  let filter = "ALL";

  function render() {
    const list = DB.papers.filter(function (p) { return filter === "ALL" || p.exam === filter; });
    grid.innerHTML = list.map(window.paperCard).join("");
    empty.classList.toggle("hidden", list.length > 0);
  }

  document.querySelectorAll("#p-filters .tab").forEach(function (t) {
    t.addEventListener("click", function () {
      document.querySelectorAll("#p-filters .tab").forEach(function (x) { x.classList.remove("active"); });
      t.classList.add("active");
      filter = t.getAttribute("data-f");
      render();
    });
  });

  /* global delegated handlers: View sample / Attempt */
  document.addEventListener("click", function (e) {
    const view = e.target.closest("[data-view]");
    if (view) {
      const p = DB.papers.find(function (x) { return x.id === Number(view.getAttribute("data-view")); });
      if (!p) return;
      const sampleQs = [
        { q: "Choose the correct option to complete the sentence: 'She ___ to the market yesterday.'", options: ["go", "went", "gone", "going"], correct: 1, explain: "Past simple — 'went' for a completed action yesterday." },
        { q: "Fill in the blank: 'There is ___ university near my house.'", options: ["a", "an", "the", "no article"], correct: 0, explain: "'a university' — 'university' starts with a consonant SOUND (yu-)." },
        { q: "Select the best synonym for 'enormous':", options: ["tiny", "huge", "average", "heavy"], correct: 1, explain: "'enormous' = very large, i.e. 'huge'." },
      ];
      window.openModal(
        '<div class="flex-between" style="position:sticky;top:0;background:inherit;z-index:2">' +
          '<div><span class="eyebrow">Sample · ' + window.esc(p.exam) + "</span>" +
          "<h3 class='mt-1'>" + window.esc(p.title) + "</h3></div>" +
          '<button class="modal-close" data-cm>' + window.VT.icon("x", 18) + "</button></div>" +
        '<div class="grid" style="gap:14px">' +
          sampleQs.map(function (q, qi) {
            return '<div class="card card-flat"><span class="badge badge-accent">Q' + (qi + 1) + "</span>" +
              "<b class='text-sm d-block mt-1'>" + window.esc(q.q) + "</b>" +
              q.options.map(function (o, oi) {
                return '<div class="text-sm mt-1" style="' + (oi === q.correct ? "color:var(--teal);font-weight:700" : "color:var(--muted)") + '">' + String.fromCharCode(65 + oi) + ". " + window.esc(o) + (oi === q.correct ? " ✓" : "") + "</div>";
              }).join("") +
              '<div class="text-xs dim mt-1">💡 ' + window.esc(q.explain) + "</div></div>";
          }).join("") +
        "</div>" +
        '<div class="flex mt-3" style="gap:10px">' +
          '<button class="btn btn-primary grow" data-fp="' + p.id + '">Attempt full paper →</button>' +
          '<button class="btn btn-ghost" data-cm>Close</button>' +
        "</div>"
      );
      const m = document.querySelector(".modal");
      m.querySelector("[data-cm]").addEventListener("click", window.VT.closeModal);
      m.querySelector("[data-fp]").addEventListener("click", function () {
        window.VT.closeModal();
        attemptPaper(p);
      });
      return;
    }
    const attempt = e.target.closest("[data-attempt]");
    if (attempt) {
      const p = DB.papers.find(function (x) { return x.id === Number(attempt.getAttribute("data-attempt")); });
      if (p) attemptPaper(p);
    }
  });

  function attemptPaper(p) {
    // map a paper to a nearest assessment, else a generic quick set
    let as = null;
    if (p.exam === "IELTS" && p.type === "Writing") as = DB.assessments[0];
    else if (p.exam === "Board") as = DB.assessments[1];
    else if (p.exam === "Interview") as = DB.assessments[2];
    else as = DB.assessments[0];
    window.VT.toast("Opening a matching timed practice for “" + p.title + "”", "info", "Attempt");
    location.href = "assessments.html?paper=" + p.id;
  }

  render();
})();
</script>
</body>
</html>
