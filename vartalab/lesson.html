<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson — VARTALAB</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236d5cff'/><text x='50' y='72' font-size='62' font-weight='bold' font-family='Arial' fill='white' text-anchor='middle'>V</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { base:'#0b0f1a', card:'#151b2b', accent:'#6d5cff', cyan2:'#22d3ee' } } } };
</script>
<link rel="stylesheet" href="css/style.css">
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</head>
<body>
<main>
  <section class="section" style="padding-top:40px">
    <div class="wrap" style="max-width:820px">
      <a href="learn.html" class="btn btn-ghost btn-sm mb-3">← Back to Learn</a>
      <div id="lesson-root"></div>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";
  const root = document.getElementById("lesson-root");
  const params = new URLSearchParams(location.search);
  const id = parseInt(params.get("id"), 10) || 1;
  const isPractice = params.get("practice") === "1";
  const lesson = DB.lessons.find(function (l) { return l.id === id; }) || DB.lessons[0];
  const u = DB.currentUser;

  let qIndex = 0;
  let wrong = [];
  let answered = false;

  /* ---------- Phase 1: Lesson intro ---------- */
  function renderIntro() {
    root.innerHTML =
      '<div class="card card-pad-lg">' +
        '<div class="flex" style="gap:10px;flex-wrap:wrap">' +
          window.skillBadge(lesson.skill) + window.diffBadge(lesson.difficulty) +
          '<span class="badge badge-amber">⚡ +' + lesson.xp + " XP</span>" +
          '<span class="badge badge-cyan">' + lesson.questions.length + " questions</span>" +
        "</div>" +
        '<h2 class="mt-3" style="font-size:clamp(1.4rem,3vw,1.9rem)">' + window.esc(lesson.title) + "</h2>" +
        '<p class="muted mt-2" style="font-size:1.02rem">' + window.esc(lesson.explanation) + "</p>" +
        '<div class="grid g2 mt-3" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">' +
          lesson.examples.map(function (ex) {
            return '<div class="card card-flat" style="border-left:3px solid var(--accent)"><span class="text-xs uppercase dim">Example</span><b class="d-block mt-1" style="font-size:1.05rem">“' + window.esc(ex) + '”</b></div>';
          }).join("") +
        "</div>" +
        '<div class="flex mt-4" style="gap:12px;flex-wrap:wrap">' +
          '<button class="btn btn-primary btn-lg" id="l-start">' + (isPractice ? "↻ Start practice" : "Start lesson") + " →</button>" +
          '<a class="btn btn-ghost btn-lg" href="videos.html">Watch a video instead</a>' +
        "</div>" +
      "</div>";
    document.getElementById("l-start").addEventListener("click", renderQuestion);
  }

  /* ---------- Phase 2: Questions one at a time ---------- */
  function renderQuestion() {
    const q = lesson.questions[qIndex];
    answered = false;
    const total = lesson.questions.length;
    const progress = Math.round((qIndex / total) * 100);
    root.innerHTML =
      '<div class="card card-pad-lg">' +
        '<div class="flex-between mb-1">' +
          '<span class="eyebrow">Question ' + (qIndex + 1) + " of " + total + "</span>" +
          '<span class="badge badge-accent">' + window.esc(lesson.skill) + "</span>" +
        "</div>" +
        '<div class="progress mb-4"><div class="progress-fill" style="width:' + progress + '%"></div></div>' +
        '<h3 style="font-size:1.25rem;min-height:2em">' + window.esc(q.q) + "</h3>" +
        '<div class="mt-3" id="l-options">' +
          q.options.map(function (o, i) {
            return '<button class="quiz-option" data-i="' + i + '"><span class="opt-letter">' + String.fromCharCode(65 + i) + "</span>" + window.esc(o) + '<span class="option-check"></span></button>';
          }).join("") +
        "</div>" +
        '<div class="flex-between mt-4" style="border-top:1px solid var(--border);padding-top:16px">' +
          '<button class="btn btn-ghost" id="l-quit">✕ Quit lesson</button>' +
          '<button class="btn btn-primary" id="l-next" disabled>Next →</button>' +
        "</div>" +
      "</div>";

    const opts = root.querySelectorAll(".quiz-option");
    opts.forEach(function (b) {
      b.addEventListener("click", function () { pick(b, q, opts); });
    });
    root.querySelector("#l-next").addEventListener("click", function () {
      qIndex++;
      if (qIndex < total) renderQuestion();
      else renderResult();
    });
    root.querySelector("#l-quit").addEventListener("click", function () {
      if (confirm("Leave this lesson? Your progress on it won't be counted.")) location.href = "learn.html";
    });
  }

  function pick(b, q, opts) {
    if (answered) return;
    answered = true;
    const i = Number(b.getAttribute("data-i"));
    const isCorrect = i === q.correct;

    opts.forEach(function (x, xi) {
      x.disabled = true;
      x.classList.add("locked");
      const check = x.querySelector(".option-check");
      if (xi === q.correct) { x.classList.add("correct"); check.innerHTML = "✓"; }
      else if (xi === i) { x.classList.add("wrong"); check.innerHTML = "✕"; }
    });
    if (!isCorrect) wrong.push({ skill: lesson.skill, q: q.q });

    const box = document.createElement("div");
    box.className = "explain-box" + (isCorrect ? "" : " wrong-x");
    box.innerHTML = '<span style="flex:none">' + (isCorrect ? "✅" : "❌") + "</span>" +
      "<div><b>" + (isCorrect ? "Correct!" : "Not quite.") + "</b><br>" + window.esc(q.explain) + "</div>";
    b.closest(".card").querySelector("#l-options").appendChild(box);
    document.getElementById("l-next").disabled = false;
  }

  /* ---------- Phase 3: Result ---------- */
  function renderResult() {
    const total = lesson.questions.length;
    const correctCount = total - wrong.length;
    const pct = Math.round((correctCount / total) * 100);
    const passed = pct >= 60;

    // ---- persist: XP, rating, streak, completed lessons, weak areas ----
    const firstTime = !(u.completedLessons || []).includes(lesson.id);
    const ratingGain = passed ? 12 : 4;
    const oldRating = u.rating;
    u.rating = Math.min(2000, u.rating + ratingGain);
    u.highestRating = Math.max(u.highestRating, u.rating);
    u.streak += 1;
    if (firstTime) u.completedLessons = (u.completedLessons || []).concat(lesson.id);
    if (wrong.length) u.weakAreas = Array.from(new Set((u.weakAreas || []).concat(wrong.map(function (w) { return w.skill; }))));
    if (passed) {
      // nudge the skill score up a little
      const skill = lesson.skill;
      u.skills[skill] = Math.min(100, (u.skills[skill] || 50) + 5);
    }
    window.VT.saveState();

    const msg = passed ? "Lesson complete!" : "Lesson finished";
    root.innerHTML =
      '<div class="card card-pad-lg center">' +
        '<div style="font-size:3.4rem">' + (passed ? "🏆" : "📚") + "</div>" +
        '<span class="eyebrow">' + (passed ? "Great work" : "Keep going") + "</span>" +
        '<h2 class="mt-1">' + msg + "</h2>" +
        '<p class="muted">You scored <b class="text-accent">' + correctCount + "/" + total + "</b> (" + pct + "%) in “" + window.esc(lesson.title) + "”.</p>" +
        '<div class="grid g3 mt-3" style="max-width:560px;margin-left:auto;margin-right:auto;text-align:left">' +
          '<div class="card card-flat center"><b style="font-size:1.2rem;color:var(--amber)">+' + lesson.xp + " XP</b><span class='text-xs dim'>Earned</span></div>" +
          '<div class="card card-flat center"><b style="font-size:1.2rem;color:var(--cyan)">+' + ratingGain + " rating</b><span class='text-xs dim'>" + oldRating + " → " + u.rating + "</span></div>" +
          '<div class="card card-flat center"><b style="font-size:1.2rem;color:var(--teal)">🔥 ' + u.streak + "</b><span class='text-xs dim'>Day streak</span></div>" +
        "</div>" +
        (wrong.length
          ? '<div class="card card-flat mt-3" style="text-align:left"><b class="text-sm">📌 Review these:</b>' +
            wrong.map(function (w) { return '<div class="text-sm muted mt-1">• ' + window.esc(w.q) + "</div>"; }).join("") + "</div>"
          : "") +
        '<div class="flex mt-4" style="justify-content:center;gap:12px;flex-wrap:wrap">' +
          '<a class="btn btn-primary btn-lg" href="leaderboard.html">See the leaderboard →</a>' +
          '<button class="btn btn-ghost btn-lg" id="l-retry">↻ Retry lesson</button>' +
          '<a class="btn btn-ghost btn-lg" href="learn.html">More lessons</a>' +
        "</div>" +
      "</div>";

    document.getElementById("l-retry").addEventListener("click", function () {
      qIndex = 0; wrong = []; renderQuestion();
    });

    window.VT.toast("Rating +" + ratingGain + " · " + lesson.xp + " XP", "success", passed ? "Lesson complete!" : "Lesson finished");
    window.VT.toast("New rating: " + u.rating, "info");
    if (passed) window.VT.confetti();
    if (firstTime && passed) window.VT.toast("Badge earned: First Blood ⚡", "success");
  }

  renderIntro();
})();
</script>
</body>
</html>
